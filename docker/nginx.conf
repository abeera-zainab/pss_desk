# Serves the built React app and fronts the API, so the browser only ever talks to
# one origin. That keeps CORS out of the picture and lets the bundle use relative
# /api URLs, which means the same image works on any host or IP.

upstream casedesk_api {
    server backend:11803;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evidence uploads are videos and disk images, not avatars. Keep this at or
    # above MAX_FILE_SIZE_MB or nginx rejects the upload before the API sees it.
    client_max_body_size 512m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container-level liveness probe; not part of the application API.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    # pdf.js ships an ES module worker (.mjs). Alpine nginx maps .mjs to
    # application/octet-stream, which Chromium refuses to run as a worker.
    location /assets/ {
        include /etc/nginx/mime.types;
        types {
            application/javascript mjs;
        }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise browsers keep loading a stale
    # bundle after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://casedesk_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Report exports and large uploads run well past the 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Stream uploads straight through instead of spooling them to nginx's disk.
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://casedesk_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections: do not time these out at the proxy.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
